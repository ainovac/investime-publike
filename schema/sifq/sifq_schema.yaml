      without an approved matching PR); the relationship is many angazhime : 1 kerkese_blerje.
      Also confirmed: "Institucionet Buxhetore nuk mund të regjistrojnë një PO nëse në sistem
      nuk ekziston e regjistruar dhe e aprovuar Vlera e Prokurimit (PR) përkatëse" and "Shuma
