        status: CONFIRMED_LOGICAL
        source: "PDF §3.5 'Fatura', Çelësi: 'ID e dokumentit financiar + Kodi institucionit/projektit'; UDHEZ docx Table 17 'Përputh: fillon përputhjen me një PO/UB' - only applies when eshte_e_lidhur_me_kontrate is true"
        kpi_codes: []
      - name: eshte_e_lidhur_me_kontrate
        type: boolean
        status: CONFIRMED_LOGICAL
        source: >
          UDHEZ PDF p.82: "Institucionet do të kenë mundësinë të regjistrojnë dy lloje
          kërkesash për pagesë/faturash: Fatura të palidhura me Kontratë/UB si për shembull
          Pagat, Faturat e Utiliteve; Fatura të lidhura me Kontrata/UB si për shembull
          Kontrata për shpenzime operative, Kontrata investimesh"
        kpi_codes: []
      - name: nivf_nslf
        type: string
        status: CONFIRMED_LOGICAL
        source: "XLSX 07_SIFQ_Thesar row 8.0: 'NIVF / NSLF (identifikuesit e fiskalizimit) ... KPI F4.2 dhe F4.3 mbështeten te faturat e fiskalizuara. Ky është identifikuesi i sigurt.'"
        kpi_codes: ["F4.2", "F4.3"]
      - name: data_fatures
        type: date
        status: CONFIRMED_LOGICAL
        source: "XLSX 07_SIFQ_Thesar row 9.0: 'Data e faturës ... Fillimi i afatit 30-ditor sipas ligjit 48/2016'; UDHEZ PDF p.82 CONFIRMS a real enforced rule: 'Datat e Faturës nuk mund të jetë më e hershme se sa data e kontratës'"
        kpi_codes: ["F4.4"]
      - name: data_mberritjes_regjistrimit
        type: date
        status: CONFIRMED_LOGICAL
        source: "XLSX 07_SIFQ_Thesar row 10.0: 'Data e mbërritjes / regjistrimit ... Fillimi alternativ i afatit — duhet konfirmuar cila përdoret'"
        kpi_codes: ["F4.4"]
        open_question: "Which date starts the Law 48/2016 30-day clock - data_fatures or this one? XLSX itself flags this as unresolved. UDHEZ does not resolve it either - it only confirms data_fatures cannot precede the contract date, a different rule."
      - name: vlera_fatures
        type: numeric (Lekë)
        status: CONFIRMED_LOGICAL
        source: "XLSX 07_SIFQ_Thesar row 11.0: 'Vlera e faturës ... Numëruesi i KPI F4.2'; UDHEZ PDF p.82 confirms real enforced rule: 'Sasitë dhe çmimi për njësi i Kontratës/UB nuk mund të tejkalohet nga sasitë dhe çmimi për njësi i faturës'"
        kpi_codes: ["F4.2"]
      - name: statusi
        type: enum [pranuar, refuzuar]
        status: CONFIRMED_LOGICAL
        source: "XLSX 07_SIFQ_Thesar row 12.0: 'Statusi i faturës ... Pranuar/refuzuar. KPI F4.2 kërkon shprehimisht statusin e verifikuar në SIFQ'; PDF §3.5 'me status pranuar/refuzuar'"
        kpi_codes: ["F4.2"]
        open_question: >
          UDHEZ shows the REAL system's invoice status is not a simple pranuar/refuzuar - it
          is three separate fields (see statusi_real_i_sistemit, statusi_miratimit,
          kontabilizuar below), where "Refuzuar" is actually a value of statusi_miratimit, not
          of this field. XLSX's "pranuar/refuzuar" looks like a simplified gloss written for
          the KPI spec, not a literal field name. This field is KEPT as-is (it's what F4.2's
          source literally cites), but F4.2 in practice most likely maps to
          statusi_miratimit = 'Miratuar' rather than to this field's values.
      - name: statusi_real_i_sistemit
        type: enum [E_Vleftesuar, Anulluar, Kerkon_Rivleftesim, E_papaguar]
        status: CONFIRMED_LOGICAL
        source: "UDHEZ docx Table 18 'Statusi i Faturës': E Vlerësuar (fondet kontrolluar/rezervuar) / Anulluar / Kërkon Rivlerësim / E papaguar - see open_question on `statusi` above"
        kpi_codes: []
      - name: statusi_miratimit
        type: enum [Nuk_Kerkohet, Kerkohet, Fillo_Miratimin, Miratuar, Refuzuar, Kerkon_Rimiratim]
        status: CONFIRMED_LOGICAL
        source: "UDHEZ docx Table 18 'Statusi i Miratimit': Nuk Kërkohet / Kërkohet / Fillo Miratimin / Miratuar / Refuzuar / Kërkon Rimiratim - the field that actually carries 'Refuzuar', not `statusi`"
        kpi_codes: []
      - name: kontabilizuar
        type: enum [Po, Pjesshem, Jo]
        status: CONFIRMED_LOGICAL
        source: "UDHEZ docx Table 18 'Kontabilizuar': Po (transferuar në LM me bazë accrual DHE cash, pra paguar) / Pjesshëm (vetëm accrual) / Jo (ende e patransferuar)"
        kpi_codes: []
      - name: statusi_rezervimit_planit_thesarit
        type: enum [D_Deshtoi, R_Kaloi]
        status: CONFIRMED_LOGICAL
        source: >
          UDHEZ PDF p.89-90: a SECOND, SEPARATE validation stage from budget approval - after
          an invoice is approved, a daily automated job ("GoA: Rezervimi i fondeve të planit
          të thesarit") reserves funds against the Treasury's cash plan (liquidity), distinct
          from the annual-budget check done at registration. D=Dështoi (failed), R=Kaloi
          (passed). Unpaid invoices get funds de-reserved automatically the next day.
        kpi_codes: []
      - name: data_ndryshimit_statusit
        type: date
        status: CONFIRMED_LOGICAL
        source: "XLSX 07_SIFQ_Thesar row 13.0: 'Data e ndryshimit të statusit ... Matja e kohës së verifikimit'"
        kpi_codes: ["F4.4"]
      - name: arsyeja_refuzimit
        type: text
        status: CONFIRMED_LOGICAL
        source: "XLSX 07_SIFQ_Thesar row 14.0: 'Arsyeja e refuzimit' (NICE-TO-HAVE); UDHEZ PDF p.88-89 confirms Treasury's final approver can 'refuzoje... duke shpjeguar motivin e refuzimit'"
        kpi_codes: ["F4.4"]
      - name: furnitor_nipt
        type: string (FK -> furnitor.nipt)
        status: CONFIRMED_LOGICAL
        source: "PDF §3.4 'Supplier (Furnitori): Subjekti furnizues, i lidhur me NIPT nga DPT'"
        kpi_codes: []
      - name: numri_furnitorit
        type: string (FK -> furnitor.numri_furnitorit)
        status: CONFIRMED_LOGICAL
        source: "UDHEZ docx Table 17 'Numri i Furnitorit: Numri i furnitorit në sistem. Vendoset nga sistemi në momentin që zgjidhet furnitori'"
        kpi_codes: []
      - name: kodi_lloj_fature
        type: string (mall/sherbim/pune)
        status: CONFIRMED_LOGICAL
        source: "PDF §3.4 'Fatura sipas lloji: Kategorizimi i faturës (mall/shërbim/punë etj.)'"
        kpi_codes: []
      - name: kushtet_pageses_dite
        type: integer (days)
        status: CONFIRMED_LOGICAL
        source: >
          UDHEZ docx Table 17 'Kushtet: Numri i ditëve nga momenti i regjistrimit të saj në
          sistem brenda të cilave duhet të realizohet pagesa e faturës tek furnitori
          përkatës'. NOTE: this appears to be the SAME real-world concept as
          pagese.afati_aplikueshem_dite (XLSX row 19.0), but the two sources place it on
          different entities (UDHEZ: invoice header field; XLSX: payment entity field). Both
          are kept, cross-referenced, rather than silently picking one.
        kpi_codes: ["F4.4"]

