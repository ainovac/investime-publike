  - name: fature
    description_sq: "Fatura / Kërkesa për Pagesë — dokumenti që kërkon pagesë, i lidhur ose jo me një kontratë (UB)"
    grain: "one row per invoice"
    primary_key: [numri_fatures]
    two_number_note: >
      UDHEZ reveals numri_fatures and numri_kuponi are TWO DIFFERENT real fields, not one:
      numri_fatures is the SUPPLIER's own invoice number ("Numri i faturës që ju ka dërguar
      furnitori duhet të jetë i papërsëritshëm" - unique per supplier, not globally), while
      numri_kuponi is the SIFQ-generated coupon/batch number (globally unique, format
      "{kodi_institucioni}-{YY}{sequential}"). The XLSX/PDF sources this project started from
      only named one "Numri i faturës" field - UDHEZ shows the real system actually has both.
    fields:
      - name: numri_fatures
        type: string
        status: CONFIRMED_LOGICAL
        source: "XLSX 07_SIFQ_Thesar row 7.0: 'Numri i faturës ... Identifikuesi i faturës' (link key = PO); UDHEZ docx Table 17 'Numri i Faturës: numrin e faturës që ju ka dërguar furnitori... duhet të jetë i papërsëritshëm' PER SUPPLIER (see two_number_note)"
        kpi_codes: ["F4.2", "F4.4"]
      - name: numri_kuponi
        type: string
        status: CONFIRMED_LOGICAL
