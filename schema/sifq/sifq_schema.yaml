# ---------------------------------------------------------------------------
# Link keys to other systems
# ---------------------------------------------------------------------------
external_link_keys:
  - name: sifq_to_afmis_composite
    fields: [periudha_viti, kodi_institucioni, kodi_programi, kodi_projekti, kodi_llogarie_ekonomike]
    source: >
      Task rule 5 mandate. Grounded in: PDF §3.9 ("no primary key AFMIS/Thesar", meeting
      28.07.2026), PDF §4.1 (kodi_institucioni, kodi_projekti as conceptual shared keys),
      XLSX 07_SIFQ_Thesar row 3.0 ("Kodi i projektit / llogaria ekonomike (230-231) ...
      Çelësi SIFQ-AFMIS"), XLSX 09_Celesat row 7.0 ("SIFQ -> AFMIS | Kodi i projektit/
      llogaria ekonomike 230-231 | fallback: Institucion + program buxhetor + vit").
      UDHEZ raises confidence in the *shape* of this key (kodi_institucioni and kodi_projekti
      are both real Oracle Flexfield segments with concrete, documented code formats - see
      platform_note) but does NOT supply real AFMIS data to verify against, so status is
      unchanged from CONFIRMED_LOGICAL_AS_COMPOSITE_NOT_AS_PK.
    status: CONFIRMED_LOGICAL_AS_COMPOSITE_NOT_AS_PK
    grain_warning: >
      SIFQ (angazhim_buxhetor) is at transaction grain; AFMIS (vlera_buxhetore_projekti) is
      at project-year grain. Joining requires aggregating SIFQ transactions up to
      (kodi_projekti, viti) before comparing to an AFMIS budget-line row - a 1:many
      relationship, not 1:1.
  - name: sifq_to_spe_transaction_number
    fields: [numri_transaksionit]
    source: >
      UPGRADED from NOT_CONFIRMED_FILLED. INTEGR (Manual Teknik, p.10-13) walks through the
      real SPE UI: before starting a procurement procedure, the procurement unit must obtain
      the "numrin e transaksionit të kërkesë blerjes" already registered and APPROVED in
      SIMF/SIFQ; SPE validates it live (shows "Ju duhet të vendosni një vlerë për fushën Numri
      i transaksionit" if blank, "Nuk ka rezultate për kërkesën e dërguar" if invalid). This
      is a real, actively-enforced production field, not a documentation proposal - though we
      still have no real data samples to see its actual values or fill-rate in practice.
    status: CONFIRMED_ACTIVELY_VALIDATED_IN_PRODUCTION_NO_SAMPLE_DATA
  - name: sifq_to_smk_spe
    fields: [numri_kontrates]
    source: "XLSX 07_SIFQ_Thesar row 2.0 'Çelësi SIFQ-SMK-SPE'; XLSX 09_Celesat row 6.0: 'SMK -> SIFQ | Numri i kontratës | fallback: NIPT i kontraktorit + numri i angazhimit'"
    status: NOT_CONFIRMED_FILLED
  - name: universal_nipt
    fields: [nipt_perfituesit / furnitor.nipt]
    source: "XLSX 09_Celesat row 9.0: 'Universal | NIPT — i pranishëm në SPE, SMK, SIFQ, DPT, AKPA'"
    status: NOT_CONFIRMED_FILLED
