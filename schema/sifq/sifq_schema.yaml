# SIFQ logical schema — machine-readable companion to docs/sifq/struktura_sifq.md
# Same conventions as afmis_schema.yaml (status/source/kpi_codes per field).
#
# Sources:
#   PDF     = docs/Struktura_te_Dhenave_AFMIS_SIFQ.pdf
#   XLSX    = docs/Investime_Publike_Specifikim_te_dhenash_per_ekstraktim_v1.xlsx, sheet 07_SIFQ_Thesar
#   KPI     = docs/KPI (komente)- Menaxhimi i investimeve publike (1).docx
#   INTEGR  = docs/Manual_teknik_Integrimi_i_SPE_me_AFMIS.pdf ("Manual Teknik - Integrimi i
#             Sistemit të Prokurimit Elektronik me AFMIS", 13 faqe) - the actual UI walkthrough
#             of registering a tender dossier in SPE, confirming numri_transaksionit and
#             kodi_institucioni as REAL, actively-validated fields (not just a proposal)
#   UDHEZ   = docs/Udhezuesi_SIFQ_Moduli_Buxhetit_UB_Pagueshmeve.docx ("Udhëzuesi i
#             Përdoruesit - Sistemi Informatik Financiar i Qeverisë") - the same guide also
#             exists as a 263-page, ~42MB PDF (not committed here - repo-size tradeoff, see
#             CLAUDE.md) covering more modules (AR, Fixed Assets, GL) than the docx does;
#             "UDHEZ PDF p.N" citations below refer to that uncommitted PDF's page numbers -
#             re-obtain it from the original source if those specific pages need re-checking.
#             The docx's 22 real UI-field tables (Budget/PR/PO/AP modules) are cited as
#             "UDHEZ docx Table N" and are fully committed/reproducible from this repo alone.

system: SIFQ
grain_note: >
  SIFQ is at TRANSACTION grain (one row per requisition / commitment / invoice / payment),
  not budget-line grain like AFMIS. This is the grain difference the task's rule 5 requires
  the AFMIS<->SIFQ link to account for - see external_link_keys below.

platform_note: >
  UDHEZ confirms SIFQ runs on Oracle E-Business Suite (the guide names "Oracle", "Flexfield",
  "GoA [institution] PO Commitments" responsibilities, etc. directly) with a 12-segment
  Accounting Flexfield: Entiteti Qeverisës, Ministria e Linjës, Institucioni (=Njësia
  Shpenzuese), Kapitulli, Programi/Funksioni, Llogaria Ekonomike, Nën-Llogaria, Zyra e
  Thesarit (TDO), Projekti, plus 3 more segments not captured in what we read. Real code
  formats confirmed with worked examples (UDHEZ docx Table 1, PDF p.7-10):
    - kodi_institucioni: 7 digits = {1 or 2 = Qendrore/Lokale}{3-digit ministry/local-gov
      code}{3-digit sequential spending-unit code}, e.g. "1011001" (Ministria e Arsimit,
      njësia shpenzuese 1), "2101001" (Bashkia Tiranë, njësia shpenzuese 1)
    - kodi_projekti: 7 chars = {G=grant / K or L=credit-loan (source text is internally
      inconsistent on this letter, see open question in struktura_sifq.md) / no-prefix for
      domestic}{3-char ministry or local-gov code}{3 or 4-digit sequential}, e.g. "GM11001"
    - numri_kerkeses (PR): "Kodi i Institucionit Buxhetor - Viti Aktual - Numër rendor"
    - numri_kuponi (invoice coupon): "{kodi_institucioni}-{YY}{numër rendor}", e.g.
      "1003001-1200025"

platform_boundary_open_question: >
  IMPORTANT - this session's earlier documents (PDF §2) state AFMIS is legally named "SIMF"
  and is a system distinct from SIFQ. But UDHEZ - titled "Sistemi Informatik Financiar i
  Qeverisë" (i.e. SIFQ itself) - documents a full "MODULI I BUXHETIT" covering "Detajimi
  Fillestar i Buxhetit" (initial budget breakdown) and "Rishikimi i Buxhetit" (budget
  revision) - functions this project's schema had attributed entirely to AFMIS. The
  Integration Manual (INTEGR) also repeatedly refers to institutions accessing "sistemin SIMF
  dhe SIFQ" together via one Web Portal, as if paired/twinned rather than fully independent.
  This raises a real possibility that AFMIS/SIMF and SIFQ are far more tightly coupled (or
  even the same underlying Oracle EBS platform under two names) than this project's rule-4
  "always keep them separate" schema design assumes. Rule 4 is still followed here (SIFQ and
  AFMIS schemas remain separate files/tables), but the budget-module entities below that come
  from UDHEZ are kept on the SIFQ side specifically because that is the document's own title -
  this is a modeling choice under genuine uncertainty, not a resolved fact. Flag this for the
  system owners before treating the AFMIS/SIFQ boundary as settled.

