        type: string
        status: CONFIRMED_LOGICAL
        source: "XLSX 07_SIFQ_Thesar row 1.0: 'Numri i angazhimit buxhetor ... Identifikuesi i entitetit' (link key = PO); PDF §3.5 'Angazhimi financiar', Çelësi: 'Kodi projektit + dokumenti financiar' (composite, see note)"
